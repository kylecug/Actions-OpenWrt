name: Build ImmortalWrt 23.05 for Xiaomi AC2350

on:
  push:
    paths:
      - '.config'
      - '.github/workflows/immortalwrt-23.05_xiaomi-ac2350.yml'
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master-23.05
  CONFIG_FILE: .config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          df -hT $PWD
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Add PassWall feeds
        working-directory: openwrt
        run: |
          echo 'src-git passwall https://github.com/xiaorouji/openwrt-passwall.git' >> feeds.conf.default
          echo 'src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply configuration
        run: |
          cp -f $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig
          grep -E 'TARGET_ath79|aiot-router-ac2350|passwall|sing-box|xray-core|v2ray-core' .config || true

      - name: Download packages
        working-directory: openwrt
        run: make download -j8

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "COMPILE_DATE=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: Check disk space
        if: always()
        run: df -hT

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-23.05-xiaomi-ac2350-${{ env.COMPILE_DATE }}
          path: openwrt/bin/targets/**/*sysupgrade*.bin
          if-no-files-found: error
